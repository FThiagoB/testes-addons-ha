name: "ControlID Manager"
version: "1.0.0"
slug: "controlid_manager"
description: "Addon de teste para abstrair o consumo da API do ControlID pelo RBP"
arch:
  - aarch64
  - armv7
  - amd64
startup: application
boot: auto
init: false

# Ingress e lateral
# https://contributors.home-assistant.io/apps/guides/ingress/
ingress: true
ingress_port: 8099
panel_icon: "mdi:door-closed-lock"
panel_title: "ControlID"
host_network: true

options:
  device_ip: "192.168.1.100"
  device_login: "root"
  device_password: ""
  use_mock: true

schema:
  device_ip: "str"
  device_login: "str"
  device_password: "password"
  use_mock: "bool?"